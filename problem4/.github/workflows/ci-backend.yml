# CI for the backend API: runs on every pull request to main. Nothing is pushed or
# deployed from here; cd-backend.yml handles releases.
name: ci-backend

# No path filter on purpose: a required check that is skipped stays "pending"
# and blocks the merge. The jobs are cheap, so they always run.
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  # The Docker image must build, but is not pushed from a pull request.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Helm chart must render for every environment.
  chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: helm lint (staging and production values)
        run: |
          for env in staging production; do
            helm lint backend/chart --strict \
              --values "backend/chart/values-${env}.yaml" \
              --set image.repository=example/backend --set image.tag=ci
          done

  # The one check branch protection requires. It always runs and fails unless
  # every job above succeeded, so a failed, cancelled or skipped job blocks the merge.
  ci-backend:
    if: always()
    needs: [test, image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require test, image and chart to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "${NEEDS}"
          jq -e 'all(.[]; .result == "success")' <<< "${NEEDS}" > /dev/null
