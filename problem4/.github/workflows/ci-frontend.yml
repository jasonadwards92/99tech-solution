# CI for the frontend SPA: runs on every pull request to main.
# Nothing is deployed from here; cd-frontend.yml handles releases.
name: ci-frontend

# No path filter on purpose: a required check that is skipped stays "pending"
# and blocks the merge. The job is cheap, so it always runs.
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run build

  # The one check branch protection requires. It always runs and fails unless
  # every job above succeeded, so a failed, cancelled or skipped job blocks the merge.
  ci-frontend:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require test to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "${NEEDS}"
          jq -e 'all(.[]; .result == "success")' <<< "${NEEDS}" > /dev/null
