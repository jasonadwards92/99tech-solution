# CD for the frontend SPA on S3 + CloudFront.
#   merge to main -> build once (kept as a workflow artifact)
#                 -> copy to the staging bucket + invalidate CloudFront
#                 -> [approval] -> same for production
# Rollback: git revert on main (any age), or re-run only the deploy job of an earlier
# successful run (within GitHub's 30-day re-run window).
name: cd-frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/cd-frontend.yml"

permissions: {}

env:
  RELEASE_SHA: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # The same build goes to staging and production.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: frontend/dist
          include-hidden-files: true # e.g. .well-known/
          retention-days: 30 # GitHub only re-runs jobs for 30 days

  deploy-staging:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: cd-frontend-staging
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC -> deploy role in the staging account
    env:
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Assume deploy role (staging account)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Order matters: assets first, index.html last, so no visitor gets a page
      # whose files aren't uploaded yet. Old assets stay for visitors on the old page.
      - name: Copy hashed assets (cached for a year)
        run: aws s3 sync site/assets "s3://${SITE_BUCKET}/assets" --cache-control "public, max-age=31536000, immutable"

      - name: Copy other files (no cache)
        run: aws s3 sync site "s3://${SITE_BUCKET}" --exclude "assets/*" --exclude "index.html" --cache-control "no-cache"

      - name: Write config.json for this environment
        run: |
          printf '{"apiUrl":"%s","version":"%s"}\n' "${API_URL}" "${RELEASE_SHA}" > config.json
          aws s3 cp config.json "s3://${SITE_BUCKET}/config.json" --cache-control "no-cache" --content-type "application/json"

      - name: Copy index.html last (goes live)
        run: aws s3 cp site/index.html "s3://${SITE_BUCKET}/index.html" --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          id="$(aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/index.html" "/config.json" --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "${DISTRIBUTION_ID}" --id "${id}"

      - name: Smoke test
        run: |
          curl -fsS "${SITE_URL}/" > /dev/null
          curl -fsS "${SITE_URL}/config.json" | grep -q "\"version\":\"${RELEASE_SHA}\""

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production # required reviewers are set on this environment
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: cd-frontend-production
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC -> deploy role in the production account
    env:
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Assume deploy role (production account)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Copy hashed assets (cached for a year)
        run: aws s3 sync site/assets "s3://${SITE_BUCKET}/assets" --cache-control "public, max-age=31536000, immutable"

      - name: Copy other files (no cache)
        run: aws s3 sync site "s3://${SITE_BUCKET}" --exclude "assets/*" --exclude "index.html" --cache-control "no-cache"

      - name: Write config.json for this environment
        run: |
          printf '{"apiUrl":"%s","version":"%s"}\n' "${API_URL}" "${RELEASE_SHA}" > config.json
          aws s3 cp config.json "s3://${SITE_BUCKET}/config.json" --cache-control "no-cache" --content-type "application/json"

      - name: Copy index.html last (goes live)
        run: aws s3 cp site/index.html "s3://${SITE_BUCKET}/index.html" --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          id="$(aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/index.html" "/config.json" --query Invalidation.Id --output text)"
          aws cloudfront wait invalidation-completed --distribution-id "${DISTRIBUTION_ID}" --id "${id}"

      - name: Smoke test
        run: |
          curl -fsS "${SITE_URL}/" > /dev/null
          curl -fsS "${SITE_URL}/config.json" | grep -q "\"version\":\"${RELEASE_SHA}\""
