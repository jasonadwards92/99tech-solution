log_format main_rid '$remote_addr [$time_local] "$request" $status '
                    'rt=$request_time urt=$upstream_response_time rid=$request_id';

server {
    listen 80;
    access_log /var/log/nginx/access.log main_rid;

    # Docker's embedded DNS. Resolving "api" per request (through the variable
    # below) means nginx starts even when the API is down, and follows the API
    # to its new IP when the container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    # nginx's own liveness, independent of the API.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
